<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html><head>
  <meta charset="UTF-8">
  <title>Employees Dashboard</title>



  <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #0b0b0b;
        color: white;
    }

    /* TOP BAR */
    .topbar {
        display: flex;
        align-items: center;
        padding: 10px 20px;
        border-bottom: 1px solid #555;
    }

    .logo {
        padding: 6px 12px;
        border: 1px solid #777;
        margin-right: 20px;
    }

    .menu {
        display: flex;
        gap: 15px;
        flex-grow: 1;
    }

    .menu span {
        padding: 6px 12px;
        border: 1px solid #666;
        cursor: pointer;
    }

    .menu .active {
        background-color: #1f4d7a;
    }

    .profile {
        width: 32px;
        height: 32px;
        background-color: pink;
        border-radius: 50%;
    }

    /* TOOL BAR */
    .toolbar {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        gap: 15px;
    }

    .new-btn {
        background-color: #9b4bb3;
        padding: 8px 18px;
        border-radius: 4px;
        cursor: pointer;
    }

    .search {
        margin-left: auto;
    }

    .search input {
        padding: 8px 12px;
        width: 220px;
        border-radius: 6px;
        border: 1px solid #666;
        background-color: #111;
        color: white;
    }

    /* GRID */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 25px;
        padding: 20px;
    }

    .card {
        border: 1px solid #777;
        padding: 12px;
        position: relative;
        background-color: #0f0f0f;
    }

    .checkbox {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 14px;
        height: 14px;
        border: 1px solid #aaa;
        border-radius: 50%;
    }

    .avatar {
        width: 70px;
        height: 70px;
        background-color: #bcdcff;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .avatar span {
        width: 30px;
        height: 30px;
        background-color: white;
        border-radius: 50%;
        display: block;
    }

    .name {
        font-size: 14px;
        color: #ccc;
    }
  </style>
</head><body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">Company Logo</div>

    <div class="menu">
        <span class="active">Employees</span>
        <a href="Attendance.html"><span>Attendance</span></a>
        <a href="Time%20Off.html"><span>Time Off</span></a>
    </div>

    
</div>


<!-- TOOLBAR -->
<div class="toolbar">
    <div class="new-btn">NEW</div>

    <div class="search">
        <input placeholder="Search" type="text">
    </div>
</div>


<!-- EMPLOYEE GRID -->
<div class="grid">

    <div class="card">
        
        <div class="avatar"><span></span></div>
        <div class="name">[Employee Name]</div>
    </div>

    <div class="card">
        
        <div class="avatar"><span></span></div>
        <div class="name">[Employee Name]</div>
    </div>

    <div class="card">
        
        <div class="avatar"><span></span></div>
        <div class="name">[Employee Name]</div>
    </div>

    <div class="card">
        
        <div class="avatar"><span></span></div>
        <div class="name">[Employee Name]</div>
    </div>

    <div class="card">
        
        <div class="avatar"><span></span></div>
        <div class="name">[Employee Name]</div>
    </div>

    <div class="card">
        
        <div class="avatar"><span></span></div>
        <div class="name">[Employee Name]</div>
    </div>

</div>


</body></html>
