<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html><head><title>HRMS Admin Dashboard</title>

<style>
body {
font-family: Arial;
background-color: #f4f6fb;
margin: 0;
}
/* Top bar */
.topbar {
background-color: #ffffff;
border-bottom: 1px solid #cccccc;
padding: 10px;
}
.logo {
font-weight: bold;
}
.tab {
padding: 5px 10px;
border: 1px solid #cccccc;
margin-right: 5px;
background-color: #eeeeee;
cursor: pointer;
}
.active {
background-color: #d66cff;
color: white;
}
.avatar {
border: 1px solid #ccc;
border-radius: 50%;
}
/* Cards */
.card {
width: 140px;
height: 150px;
border: 1px solid #cccccc;
background-color: #ffffff;
text-align: center;
padding-top: 10px;
cursor: pointer;
}
.card img {
width: 50px;
height: 50px;
}
.status {
width: 10px;
height: 10px;
border-radius: 50%;
float: right;
margin-right: 5px;
}
.green { background-color: green; }
.yellow { background-color: yellow; }
.red { background-color: red; }
/* Buttons */
.btn {
padding: 6px;
background-color: #d66cff;
color: white;
border: none;
cursor: pointer;
width: 100px;
}
.dropdown {
display: none;
position: absolute;
right: 10px;
background-color: white;
border: 1px solid #ccc;
}
</style>
<script type="text/javascript">
function showMenu() {
var menu = document.getElementById("menu");
if (menu.style.display == "block") {
menu.style.display = "none";
} else {
menu.style.display = "block";
}
}
function openProfile() {
alert("Open employee profile (view-only)");
}
function checkIn() {
document.getElementById("statusDot").className = "status green";
alert("Checked In Successfully");
}
</script>
</head><body>

<div class="topbar">

<a href="Time%20Off.html" target="_top"><span class="tab">Time Off</span></a>
</td>
<td align="right">
<img src="https://via.placeholder.com/30" class="avatar" onclick="showMenu()">
<div id="menu" class="dropdown">
<a href="#" onclick="openProfile()">My Profile</a><br>
<a href="signin.html">Log Out</a>
</div>
</td>
</tr>
</tbody></table>
</div>
