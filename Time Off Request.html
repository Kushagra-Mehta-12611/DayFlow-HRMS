<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html><head>
  <meta charset="UTF-8">
  <title>Time Off Request</title>



  <style>
    body {
        margin: 0;
        background-color: #0b0b0b;
        font-family: Arial, sans-serif;
        color: white;
    }

    /* MODAL BACKGROUND */
    .overlay {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    /* MODAL BOX */
    .modal {
        width: 520px;
        background-color: #111;
        border: 1px solid #777;
        border-radius: 14px;
        padding: 20px 25px;
    }

    /* HEADER */
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #555;
        padding-bottom: 10px;
    }

    .modal-header h3 {
        margin: 0;
        font-weight: normal;
    }

    .close {
        cursor: pointer;
        font-size: 18px;
    }

    /* CONTENT */
    .row {
        display: flex;
        margin-top: 18px;
        font-size: 14px;
    }

    .label {
        width: 160px;
        color: #ccc;
    }

    .value {
        color: #7fc1ff;
    }

    .value span {
        margin: 0 8px;
    }

    /* ATTACHMENT */
    .attach {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .upload {
        width: 36px;
        height: 36px;
        background-color: #1f6fb2;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .upload input {
        display: none;
    }

    .upload::before {
        content: "&#11014;";
        font-size: 18px;
    }

    .note {
        font-size: 13px;
        color: #aaa;
    }

    /* BUTTONS */
    .actions {
        margin-top: 25px;
        display: flex;
        gap: 12px;
    }

    .submit {
        background-color: #a655c2;
        border: none;
        padding: 8px 20px;
        border-radius: 6px;
        cursor: pointer;
    }

    .discard {
        background-color: #333;
        border: none;
        padding: 8px 20px;
        border-radius: 6px;
        color: white;
        cursor: pointer;
    }
  </style>
</head><body>

<div class="overlay">

    <div class="modal">

        <!-- HEADER -->
        <div class="modal-header">
            <h3>Time off Type Request</h3>
            <div class="close">&#10005;</div>
        </div>

        <!-- DETAILS -->
        <div class="row">
            <div class="label">Employee</div>
            <div class="value">[Employee]</div>
        </div>

        <div class="row">
            <div class="label">Time off Type</div>
            <div class="value">[Paid time off]</div>
        </div>

        <div class="row">
            <div class="label">Validity Period</div>
            <div class="value">May 13 <span>To</span> May 14</div>
        </div>

        <div class="row">
            <div class="label">Allocation</div>
            <div class="value">01.00 <span>Days</span></div>
        </div>

        <div class="row">
            <div class="label">Attachment</div>
            <div class="attach">
                <label class="upload">
                    <input type="file">
                </label>
                <div class="note">(For sick leave certificate)</div>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="actions">
            <button class="submit">Submit</button>
            <button class="discard">Discard</button>
        </div>

    </div>

</div>


</body></html>
