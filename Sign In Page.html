<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html><head>
    
  <meta charset="UTF-8">
  <title>Sign In Page</title>

    

    
  <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: 380px;
            margin: 60px auto;
            padding: 30px;
            border: 1px solid #555;
            border-radius: 8px;
            background-color: #111;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .logo {
            width: 100%;
            height: 60px;
            background-color: #1f1f1f;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            line-height: 60px;
            color: #aaa;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 5px;
            border: 1px solid #777;
            background-color: #000;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: #b35cd4;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #a655c2;
            border: none;
            border-radius: 6px;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #c26ddb;
        }

        .signup {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .signup a {
            color: #d89cff;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }
    </style>
</head><body>

    
<div class="container">
        <h2>Sign in Page</h2>

        <div class="logo">
            App / Web Logo
        </div>

        <form>
            <label>Login ID / Email :</label>
            <input placeholder="Enter email or ID" type="text">

            <label>Password :</label>
            <input placeholder="Enter password" type="password">

            <button class="btn">SIGN IN</button>
        </form>

        <div class="signup">
            Don't have an Account?
            <a href="Sign%20Up%20Page.html">Sign Up</a>
        </div>
    </div>


</body></html>
